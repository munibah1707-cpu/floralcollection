<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Floral Collection</title>
  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: 
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("https://i.ibb.co/qY53x4mW/Whats-App-Image-2025-08-25-at-01-48-10-46f9510f.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    .container {
      position: relative;
      width: 380px;
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(14px);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      text-align: center;
      color: #fff;
      overflow: hidden;
      perspective: 1000px;
      transform-style: preserve-3d;
      animation: floaty 6s ease-in-out infinite;
      transition: transform 0.5s ease;
    }
    .container:hover {
      transform: scale(1.03) rotateX(5deg) rotateY(5deg);
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.55);
      border-radius: 20px;
      transition: background 0.6s ease;
      z-index: -1; /* ✅ stays behind content */
    }

    @keyframes floaty {
      0%,100% { transform: translateY(0) rotateX(0) rotateY(0); }
      50% { transform: translateY(-10px) rotateX(2deg) rotateY(2deg); }
    }

    h2 {
      margin-bottom: 20px;
      font-size: 28px;
      color: #f9c7d3;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      font-size: 14px;
      color: #ddd;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    .form-group input:focus {
      background: rgba(255,255,255,0.3);
      box-shadow: 0 0 10px #f9c7d3;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(45deg, #f9c7d3, #e46623);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }
    button:hover {
      background: linear-gradient(45deg, #e46623, #f9c7d3);
      transform: scale(1.05);
    }

    p {
      margin-top: 15px;
      font-size: 14px;
    }
    p a {
      color: #f9c7d3;
      text-decoration: none;
      font-weight: bold;
    }
    p a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Register</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Register</button>
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const username = form.username.value.trim();
      const password = form.password.value;

      if (!name || !email || !username || !password) {
        alert("Please fill out all fields.");
        return;
      }

      localStorage.setItem("registeredUser", JSON.stringify({ name, email, username, password }));
      alert("Registration successful!");
      window.location.href = "login.html";
    });
  </script>

</body>
</html>
